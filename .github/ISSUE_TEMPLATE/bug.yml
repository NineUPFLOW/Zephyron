name: Ошибка в программе
description: Программа падает, не запускается или ведёт себя не так, как написано
labels: ["Баг"]
body:
  - type: markdown
    attributes:
      value: |
        Если не открывается сайт или приложение, используйте шаблон «Сервис не работает» —
        там спрашивается то, что нужно для такого разбора.

        **Не вставляйте ссылку на подписку** и содержимое `config\subscriptions.json`
        или `runtime\`. Ссылка равнозначна паролю.

  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы сделали, что ожидали увидеть и что увидели.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Раздел «Маршруты» → выбрать сервис
        2. Что нажали
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Сообщение об ошибке
      description: |
        Если программа что-то напечатала — целиком, включая стек вызовов.
        Журналы лежат в `logs\` рядом с программой.
      render: text

  - type: input
    id: version
    attributes:
      label: Версия Zephyron
      description: Вкладка «Прочее» → «О программе».
      placeholder: 1.4.6
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Версия Windows
      description: "`winver` покажет."
      placeholder: Windows 11 24H2
