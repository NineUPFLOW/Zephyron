name: Сервис не работает
description: Сайт или приложение не открывается, хотя обход включён
labels: ["Баг"]
body:
  - type: markdown
    attributes:
      value: |
        **Не вставляйте ссылку на подписку** и содержимое `config\subscriptions.json`
        или `runtime\`. Ссылка равнозначна паролю. Если она попала в вывод,
        замените её на `<скрыто>`.

  - type: input
    id: service
    attributes:
      label: Что не работает
      description: Имя сайта или название приложения. Одно на issue.
      placeholder: itch.io
    validations:
      required: true

  - type: textarea
    id: blockcheck
    attributes:
      label: Вывод проверки блокировок
      description: |
        Раздел «Проверка блокировок» → проверить сервис → скопировать строки
        про него вместе с причиной отказа: в ней адрес и код ошибки, по ним
        видно, кто отказал. Разделы с выводами и предупреждениями, если они
        есть, вставьте тоже.
      render: text
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - Гибрид
        - Десинк
        - Туннель
        - Туннель с «Игнорировать исключения»
        - Движки остановлены
    validations:
      required: true

  - type: input
    id: preset
    attributes:
      label: Пресет
      description: Раздел «Десинк», имя пресета.
      placeholder: Universal V12
    validations:
      required: true

  - type: input
    id: isp
    attributes:
      label: Оператор и город
      description: |
        DPI у операторов разный, и рецепт, работающий на одном, на другом
        может не работать. Без этого сравнить отчёты не с чем.
      placeholder: Ростелеком, Казань
    validations:
      required: true

  - type: textarea
    id: reality
    attributes:
      label: А что на самом деле
      description: |
        Проверка иногда ошибается. Если сервис у вас работает, а отчёт пишет
        обратное, напишите это прямо: такие случаи полезнее всего.
      placeholder: |
        В браузере открывается. В отчёте — «закрыт полностью».

  - type: input
    id: version
    attributes:
      label: Версия Zephyron
      description: Вкладка «Прочее» → «О программе».
      placeholder: 1.2.1
    validations:
      required: true
